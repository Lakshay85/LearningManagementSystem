services:
  # ==================== Database ====================
  
  # Unified LMS & RAG PostgreSQL Database with pgvector
  lms-postgres:
    image: pgvector/pgvector:pg16
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: lms
    ports:
      - '5432:5432'
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lms-network

  # ==================== Unified Backend ====================

  # LMS & RAG Unified Backend Service
  lms-backend:
    build:
      context: ./lms-backend
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: lms-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: root
      DATABASE_NAME: lms
      JWT_ACCESS_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
    ports:
      - '3000:3000'
    depends_on:
      lms-postgres:
        condition: service_healthy
    networks:
      - lms-network

  # ==================== Frontend ====================

  # LMS Frontend
  lms-frontend:
    build:
      context: ./lms-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_RAG_API_URL: http://localhost:3000
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - lms-backend
    networks:
      - lms-network

volumes:
  lms_postgres_data:
    driver: local

networks:
  lms-network:
    driver: bridge
