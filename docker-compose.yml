

services:
  # ==================== Databases ====================
  
  # LMS PostgreSQL Database
  lms-postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: lms
    ports:
      - '5432:5432'
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  # RAG PostgreSQL Database with pgvector
  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: lmsrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lmsrag
    ports:
      - '5434:5432'
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
      - ./lmsrag/Backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lms-network

  # ==================== Infrastructure ====================

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lms-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lms_user
      RABBITMQ_DEFAULT_PASS: lms_password
      RABBITMQ_DEFAULT_VHOST: lms_vhost
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network



  # ==================== Backend Services ====================

  # LMS Backend Service
  lms-backend:
    build:
      context: ./lms-backend
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: lms-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: root
      DATABASE_NAME: lms
      JWT_ACCESS_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      RABBITMQ_URL: amqp://lms_user:lms_password@rabbitmq:5672/lms_vhost
    ports:
      - '3000:3000'
    depends_on:
      lms-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lms-network

  # RAG Backend Service
  rag-backend:
    build:
      context: ./lmsrag/Backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@rag-postgres:5432/lmsrag
      JWT_ACCESS_SECRET: your-super-secret-jwt-key-change-in-production
      RABBITMQ_URL: amqp://lms_user:lms_password@rabbitmq:5672/lms_vhost
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - '3001:3001'
    depends_on:
      rag-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lms-network

  # ==================== Frontend ====================

  # LMS Frontend
  lms-frontend:
    build:
      context: ./lms-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_RAG_API_URL: http://localhost:3001
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - lms-backend
      - rag-backend
    networks:
      - lms-network

volumes:
  lms_postgres_data:
    driver: local
  rag_postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  lms-network:
    driver: bridge
