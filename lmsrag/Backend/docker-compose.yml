version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lmsrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lmsrag
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lmsrag-network

  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lmsrag-service
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lmsrag
      - RAG_API_KEY=${RAG_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - EMBEDDING_DIMENSIONS=1536
      - LLM_PROVIDER=groq
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - TOP_K=5
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'
    volumes:
      - ./uploads:/app/uploads
    networks:
      - lmsrag-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  lmsrag-network:
    driver: bridge
